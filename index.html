
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#181825">

  <title>Rika AI - Trợ lý AI trực tuyến</title>
  <meta name="description" content="Rika AI - Trợ lý trí tuệ nhân tạo hỗ trợ viết code, học tập và sáng tạo ý tưởng.">
  <meta name="keywords" content="Rika AI, chatbot AI, trợ lý AI, AI trực tuyến">
  <meta name="author" content="Rika AI">
  <meta property="og:title" content="Rika AI - Trợ lý AI trực tuyến">
  <meta property="og:description" content="Trò chuyện với Rika AI, trợ lý AI của bạn.">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a href="./" class="brand" aria-label="Rika AI trang chủ">
          <span class="brand-icon">✦</span>
          <span>Rika AI</span>
          <span class="version">ALPHA</span>
        </a>

        <button id="closeSidebarBtn" class="icon-btn close-sidebar"
          type="button" aria-label="Đóng menu">✕</button>
      </div>

      <button id="newChatBtn" class="new-chat" type="button">
        <span>＋</span> Cuộc trò chuyện mới
      </button>

      <div class="history-heading">LỊCH SỬ TRÒ CHUYỆN</div>
      <div id="historyList" class="history-list"></div>

      <div class="sidebar-bottom">
        <div class="profile-icon">✦</div>
        <div class="profile-info">
          <strong>Rika AI</strong>
          <span>Phiên bản thử nghiệm</span>
        </div>
      </div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="main">
      <header class="header">
        <button id="menuBtn" class="icon-btn menu-btn"
          type="button" aria-label="Mở menu">☰</button>

        <div class="header-brand">
          <span class="header-logo">✦</span>
          <span>Rika AI</span>
        </div>

        <div class="status">
          <span class="status-dot"></span>
          <span>Trợ lý AI</span>
        </div>
      </header>

      <section id="chatBox" class="chat-box" aria-live="polite">
        <div id="welcomeBox" class="welcome">
          <div class="welcome-logo">✦</div>
          <h1>Xin chào! 👋</h1>
          <p>Mình là Rika AI. Hôm nay mình có thể giúp gì cho bạn?</p>

          <div class="suggestions">
            <button class="suggestion" type="button"
              data-prompt="Giúp tôi viết code và giải thích từng bước.">
              <span>⌨</span>
              <span>Giúp tôi viết code</span>
            </button>

            <button class="suggestion" type="button"
              data-prompt="Giải thích cho tôi một kiến thức theo cách dễ hiểu.">
              <span>📚</span>
              <span>Giải thích kiến thức</span>
            </button>

            <button class="suggestion" type="button"
              data-prompt="Giúp tôi lên một ý tưởng mới thật sáng tạo.">
              <span>💡</span>
              <span>Lên ý tưởng mới</span>
            </button>
          </div>
        </div>
      </section>

      <form id="chatForm" class="input-area">
        <div class="input-wrap">
          <textarea id="userInput" rows="1"
            placeholder="Nhắn tin cho Rika AI..."
            aria-label="Tin nhắn"
            maxlength="20000"></textarea>

          <button id="sendBtn" type="submit"
            aria-label="Gửi tin nhắn">➤</button>
        </div>

        <p class="disclaimer">
          Rika AI có thể trả lời chưa chính xác.
          Hãy kiểm tra thông tin quan trọng.
        </p>
      </form>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
